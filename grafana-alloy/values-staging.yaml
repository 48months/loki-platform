# Grafana Alloy values for staging. Chart version and cluster name are in versions.env.
controller:
  type: daemonset

alloy:
  configMap:
    create: true
    # content is set at deploy time with --set-file alloy.configMap.content=config.alloy

  mounts:
    varlog: true

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: CLUSTER_NAME
      value: "non-prod-green-v2"
    - name: LOKI_PUSH_URL
      value: "http://13.41.18.169:3100/loki/api/v1/push"
    - name: LOG_NAMESPACE_REGEX
      value: "^staging$"

tolerations:
  - operator: Exists

serviceAccount:
  create: true

rbac:
  create: true
